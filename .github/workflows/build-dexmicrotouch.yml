name: Build DeX MicroTouch APK
on:
  push:
    branches: [chatgpt-dexmicrotouch-build]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate source
        shell: bash
        run: |
          cat > source.b64 <<'EOF'
 ...REDACTED_FOR_BREVITY...
EOF
          base64 -d source.b64 > source.zip
          unzip -q source.zip
      - name: Build APK
        shell: bash
        run: |
          cd DexMicroTouch
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DexMicroTouch-debug-apk
          path: DexMicroTouch/app/build/outputs/apk/debug/app-debug.apk
